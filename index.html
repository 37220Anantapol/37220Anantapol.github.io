<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | อนันทพล อุดมผล</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eeeeee, #d6d6d6);
    color: #333;
}

/* แถบเมนู */
nav {
    background: #333333;
    padding: 15px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

nav a {
    display: inline-block;
    color: white;
    text-decoration: none;
    margin: 5px;
    padding: 10px 18px;
    border-radius: 25px;
    background: #444444;
    transition: 0.3s;
}

nav a:hover {
    background: #f28c28;
    transform: translateY(-2px);
}

/* กล่องหลัก */
.card {
    max-width: 850px;
    margin: 50px auto;
    padding: 45px 30px;
    background: #ffffff;
    border-radius: 30px;
    border: 4px solid #f28c28;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
}

/* หัวข้อ */
h1 {
    color: #f28c28;
    font-size: 40px;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    font-size: 20px;
}

/* รูปโปรไฟล์ */
.profile {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 50%;
    border: 8px solid #f28c28;
    margin: 25px auto;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

/* ข้อความ */
.info {
    font-size: 19px;
    line-height: 1.8;
    color: #555;
}

/* ปุ่ม */
.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 30px;
    background: #f28c28;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    background: #333333;
    transform: scale(1.05);
}

/* มือถือ */
@media (max-width: 600px) {

    .card {
        margin: 25px 15px;
        padding: 30px 20px;
    }

    h1 {
        font-size: 30px;
    }

    .profile {
        width: 160px;
        height: 160px;
    }

    nav a {
        font-size: 14px;
        padding: 8px 12px;
    }
}

</style>
</head>

<body>

<!-- เมนู -->
<nav>
    <a href="index.html">🏠 หน้าหลัก</a>
    <a href="portfolio.html">📁 Portfolio</a>
</nav>


<!-- เนื้อหาหลัก -->
<div class="card">

    <h1>👋 ยินดีต้อนรับ</h1>

    <p class="subtitle">
        เว็บไซต์แนะนำตัวและแฟ้มสะสมผลงาน
    </p>


    <!-- รูปโปรไฟล์ -->
    <img src="profile.jpg"
         alt="รูปโปรไฟล์"
         class="profile">


    <div class="info">

        <p>
            สวัสดีครับ ผมชื่อ
            <strong>อนันทพล อุดมผล</strong>
        </p>

        <p>
            นักเรียนชั้นมัธยมศึกษาปีที่ 6
        </p>

        <p>
            📐 มีความสนใจด้าน
            <strong>วิศวกรรมโยธา (Civil Engineering)</strong>
        </p>

        <p>
            ผมสนใจการออกแบบ การก่อสร้าง
            และการสร้างสิ่งต่าง ๆ ที่สามารถนำไปใช้ได้จริง
        </p>

    </div>


    <!-- ปุ่มไป Portfolio -->
    <a href="portfolio.html" class="btn">
        📁 ดูแฟ้มสะสมผลงาน
    </a>

</div>

</body>
</html>
