<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anantapol | Personal Profile</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, "Tahoma", sans-serif;

    background: #eef5f9;
    color: #263746;
}


/* =========================
   NAVBAR
========================= */

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: #102a43;

    padding: 15px;

    text-align: center;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.navbar a {
    display: inline-block;

    color: white;
    text-decoration: none;

    padding: 10px 18px;
    margin: 4px;

    border-radius: 8px;

    font-weight: bold;

    transition: 0.3s;
}

.navbar a:hover {
    background: #f2994a;
    transform: translateY(-2px);
}


/* =========================
   HERO
========================= */

.hero {
    min-height: 90vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 50px 20px;

    background:
        linear-gradient(
            135deg,
            #102a43,
            #1f5f7a,
            #4da8c7
        );

    color: white;

    text-align: center;
}

.hero-content {
    max-width: 850px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #f2994a;
}

.hero p {
    font-size: 20px;
    line-height: 1.8;
}


/* =========================
   PROFILE IMAGE
========================= */

.profile {
    width: 220px;
    height: 220px;

    object-fit: cover;

    border-radius: 50%;

    border: 8px solid white;

    box-shadow:
        0 0 0 8px #f2994a,
        0 10px 30px rgba(0,0,0,0.3);

    margin-bottom: 25px;
}


/* =========================
   BUTTON
========================= */

.btn {
    display: inline-block;

    margin: 12px 6px;

    padding: 14px 25px;

    border-radius: 8px;

    text-decoration: none;

    font-weight: bold;

    transition: 0.3s;
}

.btn-main {
    background: #f2994a;
    color: white;
}

.btn-main:hover {
    background: #e67e22;
    transform: translateY(-3px);
}

.btn-outline {
    border: 2px solid white;
    color: white;
}

.btn-outline:hover {
    background: white;
    color: #102a43;
}


/* =========================
   SECTION
========================= */

.section {
    max-width: 1000px;

    margin: 60px auto;

    padding: 40px 25px;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 8px 30px rgba(16,42,67,0.1);
}

.section-title {
    text-align: center;

    font-size: 32px;

    color: #102a43;

    margin-bottom: 35px;
}

.section-title span {
    color: #f2994a;
}


/* =========================
   ABOUT
========================= */

.about-box {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;
}

.info {
    background: #f3f8fb;

    border-left: 5px solid #f2994a;

    padding: 20px;

    border-radius: 10px;
}

.info h3 {
    color: #1f5f7a;
}

.info p {
    line-height: 1.8;
}


/* =========================
   GOAL
========================= */

.goal {
    background: #102a43;

    color: white;

    border-radius: 15px;

    padding: 30px;

    text-align: center;
}

.goal h2 {
    color: #f2994a;
}

.goal p {
    font-size: 18px;
    line-height: 1.9;
}


/* =========================
   INTEREST
========================= */

.interests {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}

.interest-card {
    text-align: center;

    padding: 30px 15px;

    background: #f3f8fb;

    border-radius: 15px;

    transition: 0.3s;
}

.interest-card:hover {
    transform: translateY(-7px);

    box-shadow:
        0 10px 25px rgba(0,0,0,0.12);
}

.interest-card .icon {
    font-size: 45px;
}

.interest-card h3 {
    color: #1f5f7a;
}


/* =========================
   FOOTER
========================= */

footer {
    background: #102a43;

    color: white;

    text-align: center;

    padding: 30px;
}

footer span {
    color: #f2994a;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .hero h1 {
        font-size: 34px;
    }

    .hero p {
        font-size: 17px;
    }

    .profile {
        width: 180px;
        height: 180px;
    }

    .about-box {
        grid-template-columns: 1fr;
    }

    .interests {
        grid-template-columns: 1fr;
    }

    .navbar a {
        font-size: 13px;
        padding: 8px 10px;
    }

    .section {
        margin: 30px 15px;
        padding: 30px 18px;
    }

}

</style>

</head>


<body>


<!-- =========================
     เมนู
========================= -->

<nav class="navbar">

    <a href="index.html">หน้าแรก</a>

    <a href="portfolio.html">Portfolio</a>

    <a href="#about">About Me</a>

    <a href="#goal">เป้าหมาย</a>

</nav>


<!-- =========================
     หน้าเปิด
========================= -->

<section class="hero">

    <div class="hero-content">

        <!-- รูปโปรไฟล์ -->
        <img
            src="profile.jpg"
            class="profile"
            alt="รูปของอนันทพล"
        >

        <h1>
            สวัสดีครับ ผม <span>อนันทพล อุดมผล</span>
        </h1>

        <p>
            นักเรียนชั้นมัธยมศึกษาปีที่ 6/5
        </p>

        <p>
            🏗️ ผู้ที่มีความสนใจในด้าน
            <strong>วิศวกรรมโยธา</strong>
        </p>

        <p>
            "ผมอยากสร้างบางสิ่งขึ้นมา

        </p>


        <a href="portfolio.html"
           class="btn btn-main">

            ดู Portfolio

        </a>


        <a href="#about"
           class="btn btn-outline">

            รู้จักผมมากขึ้น

        </a>

    </div>

</section>
