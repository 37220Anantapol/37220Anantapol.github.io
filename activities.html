<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิจกรรม - นายอนันทพล อุดมผล</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: sans-serif;
            color: #555555;
            background: linear-gradient(
                135deg,
                #f28c28,
                #f5b36b,
                #d6d6d6,
                #666666
            );
            min-height: 100vh;
        }
        nav {
            background: rgba(255,255,255,0.95);
            border-bottom: 5px solid #f28c28;
            padding: 15px;
            text-align: center;
        }
        nav a {
            text-decoration: none;
            color: #e67e22;
            font-weight: bold;
            margin: 0 15px;
        }
        nav a:hover {
            color: #f28c28;
        }
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #e67e22;
            margin-bottom: 35px;
        }
        .activities {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }
        .activity {
            background: #fff7ed;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .activity h2 {
            color: #e67e22;
            margin-bottom: 15px;
        }
        .activity p {
            font-size: 17px;
            line-height: 1.8;
        }
        .activity img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: white;
        }
        @media (max-width: 700px) {
            .activities {
                grid-template-columns: 1fr;
            }
            .container {
                margin: 25px 15px;
                padding: 25px;
            }
            nav a {
                display: inline-block;
                margin: 5px 8px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">หน้าหลัก</a>
        <a href="introduction.html">คำนำ</a>
        <a href="about.html">ประวัติส่วนตัว</a>
        <a href="education.html">การศึกษา</a>
        <a href="works.html">ผลงาน</a>
        <a href="activities.html">กิจกรรม</a>
        <a href="skills.html">ความสามารถ</a>
    </nav>
    <div class="container">
        <h1>กิจกรรม</h1>
        <div class="activities">
            <!-- กิจกรรมที่ 1 -->
            <div class="activity">
                <h2>กิจกรรมที่ 1</h2>
                <img src="activity1.jpg" alt="กิจกรรมที่ 1">
                <p>
                    รายละเอียดกิจกรรมที่ 1
                </p>
            </div>
            <!-- กิจกรรมที่ 2 -->
            <div class="activity">
                <h2>กิจกรรมที่ 2</h2>
                <img src="activity2.jpg" alt="กิจกรรมที่ 2">
                <p>
                    รายละเอียดกิจกรรมที่ 2
                </p>
            </div>
            <!-- กิจกรรมที่ 3 -->
            <div class="activity">
                <h2>กิจกรรมที่ 3</h2>
                <img src="activity3.jpg" alt="กิจกรรมที่ 3">
                <p>
                    รายละเอียดกิจกรรมที่ 3
                </p>
            </div>
            <!-- กิจกรรมที่ 4 -->
            <div class="activity">
                <h2>กิจกรรมที่ 4</h2>
                <img src="activity4.jpg" alt="กิจกรรมที่ 4">
                <p>
                    รายละเอียดกิจกรรมที่ 4
                </p>
            </div>
        </div>
    </div>
    <footer>
        © 2026 Portfolio - นายอนันทพล อุดมผล
    </footer>
</body>
</html>
